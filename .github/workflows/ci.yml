name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # postinstall runs `prisma generate`, which needs no database connection.
      - run: npm ci

      # PageProps and LayoutProps are generated by Next.js, so create them before type-checking.
      - run: npx next typegen

      - run: npx tsc --noEmit

      - run: npm run lint

      - run: npm test
